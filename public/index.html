<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>顾客生日簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF7F0;
    --text: #3A2E2A;
    --muted: #8A7A72;
    --muted-light: #B3A69B;
    --card: #FFFFFF;
    --card-border: #EDE4D8;
    --input-bg: #FDFBF7;
    --input-border: #E5DACB;
    --accent: #C4635A;
    --accent-text: #FBF7F0;
  }
  html[data-theme="dark"] {
    --bg: #211D1A;
    --text: #F1EAE3;
    --muted: #B3A69B;
    --muted-light: #8A7A72;
    --card: #2B2622;
    --card-border: #3D362F;
    --input-bg: #26221E;
    --input-border: #3D362F;
    --accent-text: #211D1A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    transition: background 0.2s, color 0.2s;
  }
  .font-display { font-family: 'Fraunces', serif; }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .icon-badge {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  h1 {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .subtitle {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 32px 52px;
  }

  /* settings */
  .settings-wrap { position: relative; }
  .settings-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .settings-btn:hover { color: var(--text); border-color: var(--accent); }
  .settings-panel {
    position: absolute;
    right: 0;
    top: 46px;
    width: 240px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    z-index: 10;
    display: none;
  }
  .settings-panel.open { display: block; }
  .settings-section { margin-bottom: 16px; }
  .settings-section:last-child { margin-bottom: 0; }
  .settings-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted-light);
    margin: 0 0 8px;
  }
  .swatches { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    padding: 0;
    flex-shrink: 0;
  }
  .swatch.active { border-color: var(--text); }
  .color-input-wrap {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    border: 1px dashed var(--muted-light);
    flex-shrink: 0;
  }
  .color-input-wrap input[type="color"] {
    position: absolute;
    top: -4px; left: -4px;
    width: 32px; height: 32px;
    border: none;
    cursor: pointer;
    background: none;
    padding: 0;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .toggle-row span { font-size: 13px; }
  .switch {
    width: 36px;
    height: 20px;
    border-radius: 999px;
    background: var(--input-border);
    position: relative;
    cursor: pointer;
    border: none;
    padding: 0;
    flex-shrink: 0;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: white;
    transition: left 0.15s;
  }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 18px; }
  .lang-toggle { display: flex; gap: 6px; }
  .lang-btn {
    flex: 1;
    padding: 6px 0;
    border-radius: 8px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--muted);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .lang-btn.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 40px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .form-grid {
    display: grid;
    grid-template-columns: auto 1fr 1fr auto;
    gap: 12px;
  }
  @media (max-width: 560px) {
    .form-grid { grid-template-columns: 1fr; }
  }
  .emoji-wrap { position: relative; }
  .emoji-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .emoji-panel {
    position: absolute;
    left: 0;
    top: 46px;
    width: 220px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    z-index: 10;
    display: none;
  }
  .emoji-panel.open { display: block; }
  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .emoji-option {
    font-size: 18px;
    background: none;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    padding: 4px 0;
  }
  .emoji-option:hover, .emoji-option.active { background: var(--input-bg); }
  .emoji-custom {
    display: flex;
    gap: 6px;
    border-top: 1px solid var(--card-border);
    padding-top: 10px;
  }
  .emoji-custom input {
    flex: 1;
    min-width: 0;
    padding: 6px 10px;
    font-size: 14px;
  }
  input[type="text"], input[type="date"] {
    padding: 10px 16px;
    border-radius: 12px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    outline: none;
  }
  input[type="text"]:focus, input[type="date"]:focus {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  input::placeholder { color: var(--muted-light); }
  button.primary {
    padding: 10px 16px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: filter 0.15s;
  }
  button.primary:hover { filter: brightness(0.92); }
  .error-msg {
    font-size: 12px;
    color: var(--accent);
    margin: 8px 0 0;
  }
  .empty-state, .loading-state {
    text-align: center;
    padding: 60px 0;
    color: var(--muted-light);
    font-size: 14px;
  }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--card);
    transition: border-color 0.15s;
  }
  .row:hover { border-color: color-mix(in srgb, var(--accent) 30%, var(--card-border)); }
  .row.today {
    background: color-mix(in srgb, var(--accent) 12%, var(--bg));
    border-color: color-mix(in srgb, var(--accent) 40%, var(--card-border));
  }
  .row-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--accent) 14%, var(--card));
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .row.today .avatar {
    background: var(--accent);
    color: var(--accent-text);
  }
  .info { min-width: 0; }
  .cust-name {
    font-weight: 500;
    font-size: 14px;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cust-meta {
    font-size: 12px;
    color: var(--muted);
    margin: 2px 0 0;
  }
  .row-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .days-left {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted-light);
  }
  .row.today .days-left { color: var(--accent); }
  .del-btn {
    background: none;
    border: none;
    color: var(--muted-light);
    cursor: pointer;
    padding: 4px;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
  }
  .row:hover .del-btn { opacity: 1; }
  .del-btn:hover { color: var(--accent); background: none; }
  .footer-count {
    text-align: center;
    font-size: 12px;
    color: var(--muted-light);
    margin-top: 32px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="header-left">
        <div class="icon-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v3"/><path d="M12 8v3"/><path d="M17 8v3"/><path d="M7 4h.01"/><path d="M12 4h.01"/><path d="M17 4h.01"/></svg>
        </div>
        <h1 class="font-display" id="title">顾客生日簿</h1>
      </div>
      <div class="settings-wrap">
        <button class="settings-btn" id="settingsBtn" aria-label="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <div class="settings-panel" id="settingsPanel">
          <div class="settings-section">
            <p class="settings-label" id="colorLabel">颜色</p>
            <div class="swatches" id="swatches">
              <button class="swatch active" data-color="#C4635A" style="background:#C4635A"></button>
              <button class="swatch" data-color="#2F8F84" style="background:#2F8F84"></button>
              <button class="swatch" data-color="#5B5FC7" style="background:#5B5FC7"></button>
              <button class="swatch" data-color="#C74B7A" style="background:#C74B7A"></button>
              <button class="swatch" data-color="#C08A2E" style="background:#C08A2E"></button>
              <button class="swatch" data-color="#4C7A3D" style="background:#4C7A3D"></button>
              <div class="color-input-wrap" title="自定义颜色">
                <input type="color" id="customColor" value="#C4635A" />
              </div>
            </div>
          </div>
          <div class="settings-section">
            <div class="toggle-row">
              <span id="darkModeLabel">深色模式</span>
              <button class="switch" id="darkToggle" aria-label="深色模式"></button>
            </div>
          </div>
          <div class="settings-section">
            <p class="settings-label" id="langLabel">语言</p>
            <div class="lang-toggle">
              <button class="lang-btn" data-lang="zh">中文</button>
              <button class="lang-btn" data-lang="en">English</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <p class="subtitle" id="subtitle">记录每一位顾客的生日,不错过任何一个惊喜的理由</p>

    <div class="card">
      <div class="form-grid">
        <div class="emoji-wrap">
          <button class="emoji-btn" id="emojiBtn" type="button">🎂</button>
          <div class="emoji-panel" id="emojiPanel">
            <div class="emoji-grid" id="emojiGrid">
              <button class="emoji-option active" data-emoji="🎂">🎂</button>
              <button class="emoji-option" data-emoji="🎉">🎉</button>
              <button class="emoji-option" data-emoji="🎈">🎈</button>
              <button class="emoji-option" data-emoji="🥳">🥳</button>
              <button class="emoji-option" data-emoji="🎁">🎁</button>
              <button class="emoji-option" data-emoji="🌟">🌟</button>
              <button class="emoji-option" data-emoji="❤️">❤️</button>
              <button class="emoji-option" data-emoji="🌸">🌸</button>
              <button class="emoji-option" data-emoji="😊">😊</button>
              <button class="emoji-option" data-emoji="👑">👑</button>
              <button class="emoji-option" data-emoji="🍀">🍀</button>
              <button class="emoji-option" data-emoji="⭐">⭐</button>
            </div>
            <div class="emoji-custom">
              <input id="customEmojiInput" type="text" maxlength="8" placeholder="输入任意 emoji" />
            </div>
          </div>
        </div>
        <input id="nameInput" type="text" />
        <input id="dateInput" type="date" />
        <button class="primary" id="addBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          <span id="addBtnLabel">添加</span>
        </button>
      </div>
      <p class="error-msg" id="errorMsg" style="display:none;"></p>
    </div>

    <div id="content">
      <div class="loading-state" id="loadingLabel">加载中…</div>
    </div>

    <p class="footer-count" id="footerCount" style="display:none;"></p>
  </div>

<script>
const API = "/api/customers";
let customers = [];

const I18N = {
  zh: {
    title: "顾客生日簿",
    subtitle: "记录每一位顾客的生日,不错过任何一个惊喜的理由",
    namePlaceholder: "顾客姓名",
    addBtn: "添加",
    colorLabel: "颜色",
    darkModeLabel: "深色模式",
    langLabel: "语言",
    loading: "加载中…",
    empty: "还没有记录,添加第一位顾客的生日吧",
    loadFailed: "加载失败,请刷新重试",
    deleteFailed: "删除失败,请重试",
    errorName: "请输入顾客姓名",
    errorDate: "请选择生日日期",
    errorAdd: "添加失败",
    errorNetwork: "网络错误,请重试",
    todayBirthday: "今天生日!",
    daysAfter: (n) => `${n} 天后`,
    willTurn: (n) => `将满 ${n} 岁`,
    monthDay: (m, d) => `${m}月${d}日`,
    footerCount: (n) => `共 ${n} 位顾客 · 按生日临近顺序排列`,
    deleteLabel: "删除",
    emojiPlaceholder: "输入任意 emoji",
  },
  en: {
    title: "Customer Birthdays",
    subtitle: "Keep track of every customer's birthday, and never miss a reason to celebrate",
    namePlaceholder: "Customer name",
    addBtn: "Add",
    colorLabel: "Color",
    darkModeLabel: "Dark mode",
    langLabel: "Language",
    loading: "Loading…",
    empty: "No records yet — add your first customer's birthday",
    loadFailed: "Failed to load. Please refresh.",
    deleteFailed: "Failed to delete. Please try again.",
    errorName: "Please enter a customer name",
    errorDate: "Please select a birthday",
    errorAdd: "Failed to add",
    errorNetwork: "Network error, please try again",
    todayBirthday: "Birthday today!",
    daysAfter: (n) => `in ${n} day${n === 1 ? "" : "s"}`,
    willTurn: (n) => `Turning ${n}`,
    monthDay: (m, d) => {
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return `${months[m-1]} ${d}`;
    },
    footerCount: (n) => `${n} customer${n === 1 ? "" : "s"} · sorted by upcoming birthday`,
    deleteLabel: "Delete",
    emojiPlaceholder: "Type any emoji",
  },
};

const PREFS_KEY = "birthday-app-prefs";
let prefs = { color: "#C4635A", dark: false, lang: "zh" };
try {
  const saved = JSON.parse(localStorage.getItem(PREFS_KEY) || "{}");
  prefs = { ...prefs, ...saved };
} catch (e) {}

function savePrefs() {
  localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
}

function applyPrefs() {
  document.documentElement.setAttribute("data-theme", prefs.dark ? "dark" : "light");
  document.documentElement.style.setProperty("--accent", prefs.color);
  document.getElementById("darkToggle").classList.toggle("on", prefs.dark);
  document.querySelectorAll(".swatch").forEach(sw => {
    sw.classList.toggle("active", sw.dataset.color.toLowerCase() === prefs.color.toLowerCase());
  });
  document.getElementById("customColor").value = prefs.color;
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.lang === prefs.lang);
  });
  applyLanguage();
}

function t() { return I18N[prefs.lang]; }

function applyLanguage() {
  const s = t();
  document.title = s.title;
  document.getElementById("title").textContent = s.title;
  document.getElementById("subtitle").textContent = s.subtitle;
  document.getElementById("nameInput").placeholder = s.namePlaceholder;
  document.getElementById("addBtnLabel").textContent = s.addBtn;
  document.getElementById("colorLabel").textContent = s.colorLabel;
  document.getElementById("darkModeLabel").textContent = s.darkModeLabel;
  document.getElementById("langLabel").textContent = s.langLabel;
  document.getElementById("loadingLabel").textContent = s.loading;
  document.getElementById("customEmojiInput").placeholder = s.emojiPlaceholder;
  document.documentElement.lang = prefs.lang === "zh" ? "zh-CN" : "en";
  render();
}

function daysUntilNextBirthday(dateStr) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const [, m, d] = dateStr.split("-").map(Number);
  let next = new Date(today.getFullYear(), m - 1, d);
  if (next < today) next = new Date(today.getFullYear() + 1, m - 1, d);
  return Math.round((next - today) / 86400000);
}

function ageTurning(dateStr) {
  const today = new Date();
  const [y, m, d] = dateStr.split("-").map(Number);
  let next = new Date(today.getFullYear(), m - 1, d);
  if (next < today) next.setFullYear(today.getFullYear() + 1);
  return next.getFullYear() - y;
}

let selectedEmoji = "🎂";

const contentEl = document.getElementById("content");
const footerEl = document.getElementById("footerCount");
const nameInput = document.getElementById("nameInput");
const dateInput = document.getElementById("dateInput");
const errorMsg = document.getElementById("errorMsg");

function render() {
  const s = t();
  if (customers.length === 0) {
    contentEl.innerHTML = `<div class="empty-state">${s.empty}</div>`;
    footerEl.style.display = "none";
    return;
  }

  const sorted = [...customers]
    .map(c => ({ ...c, days: daysUntilNextBirthday(c.date) }))
    .sort((a, b) => a.days - b.days);

  const rows = sorted.map(c => {
    const isToday = c.days === 0;
    const [, mm, dd] = c.date.split("-").map(Number);
    return `
      <div class="row ${isToday ? "today" : ""}">
        <div class="row-left">
          <div class="avatar">${c.emoji || "🎂"}</div>
          <div class="info">
            <p class="cust-name">${escapeHtml(c.name)}</p>
            <p class="cust-meta">${s.monthDay(mm, dd)} · ${s.willTurn(ageTurning(c.date))}</p>
          </div>
        </div>
        <div class="row-right">
          <span class="days-left">${isToday ? s.todayBirthday : s.daysAfter(c.days)}</span>
          <button class="del-btn" onclick="removeCustomer('${c.id}')" aria-label="${s.deleteLabel}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>
      </div>`;
  }).join("");

  contentEl.innerHTML = `<div class="list">${rows}</div>`;
  footerEl.style.display = "block";
  footerEl.textContent = s.footerCount(sorted.length);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

async function loadCustomers() {
  try {
    const res = await fetch(API);
    customers = await res.json();
    render();
  } catch (e) {
    contentEl.innerHTML = `<div class="empty-state">${t().loadFailed}</div>`;
  }
}

async function addCustomer() {
  const s = t();
  const name = nameInput.value.trim();
  const date = dateInput.value;
  errorMsg.style.display = "none";

  if (!name) { showError(s.errorName); return; }
  if (!date) { showError(s.errorDate); return; }

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, date, emoji: selectedEmoji }),
    });
    if (!res.ok) {
      const data = await res.json();
      showError(data.error || s.errorAdd);
      return;
    }
    const newCustomer = await res.json();
    customers.push(newCustomer);
    nameInput.value = "";
    dateInput.value = "";
    selectedEmoji = "🎂";
    document.getElementById("emojiBtn").textContent = selectedEmoji;
    document.getElementById("customEmojiInput").value = "";
    document.querySelectorAll(".emoji-option").forEach(b => b.classList.toggle("active", b.dataset.emoji === selectedEmoji));
    render();
  } catch (e) {
    showError(s.errorNetwork);
  }
}

async function removeCustomer(id) {
  try {
    await fetch(`${API}/${id}`, { method: "DELETE" });
    customers = customers.filter(c => c.id !== id);
    render();
  } catch (e) {
    alert(t().deleteFailed);
  }
}

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = "block";
}

document.getElementById("addBtn").addEventListener("click", addCustomer);
[nameInput, dateInput].forEach(el => {
  el.addEventListener("keydown", e => { if (e.key === "Enter") addCustomer(); });
});

// emoji picker
const emojiBtn = document.getElementById("emojiBtn");
const emojiPanel = document.getElementById("emojiPanel");
const customEmojiInput = document.getElementById("customEmojiInput");

emojiBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  emojiPanel.classList.toggle("open");
});

document.querySelectorAll(".emoji-option").forEach(btn => {
  btn.addEventListener("click", () => {
    selectedEmoji = btn.dataset.emoji;
    emojiBtn.textContent = selectedEmoji;
    customEmojiInput.value = "";
    document.querySelectorAll(".emoji-option").forEach(b => b.classList.toggle("active", b === btn));
    emojiPanel.classList.remove("open");
  });
});

customEmojiInput.addEventListener("input", (e) => {
  const val = e.target.value.trim();
  if (val) {
    selectedEmoji = val;
    emojiBtn.textContent = val;
    document.querySelectorAll(".emoji-option").forEach(b => b.classList.remove("active"));
  }
});

document.addEventListener("click", (e) => {
  if (!emojiPanel.contains(e.target) && e.target !== emojiBtn) {
    emojiPanel.classList.remove("open");
  }
});

// settings panel
const settingsBtn = document.getElementById("settingsBtn");
const settingsPanel = document.getElementById("settingsPanel");
settingsBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  settingsPanel.classList.toggle("open");
});
document.addEventListener("click", (e) => {
  if (!settingsPanel.contains(e.target) && e.target !== settingsBtn) {
    settingsPanel.classList.remove("open");
  }
});

document.querySelectorAll(".swatch").forEach(sw => {
  sw.addEventListener("click", () => {
    prefs.color = sw.dataset.color;
    savePrefs();
    applyPrefs();
  });
});

document.getElementById("customColor").addEventListener("input", (e) => {
  prefs.color = e.target.value;
  savePrefs();
  applyPrefs();
});

document.getElementById("darkToggle").addEventListener("click", () => {
  prefs.dark = !prefs.dark;
  savePrefs();
  applyPrefs();
});

document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    prefs.lang = btn.dataset.lang;
    savePrefs();
    applyPrefs();
  });
});

applyPrefs();
loadCustomers();
</script>
</body>
</html>
