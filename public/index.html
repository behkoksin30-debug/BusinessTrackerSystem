<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>顾客记录</title>

<!-- PWA: 让网页可以像 App 一样添加到手机主屏幕 -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#C4635A" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="顾客记录" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF7F0;
    --text: #3A2E2A;
    --muted: #8A7A72;
    --muted-light: #B3A69B;
    --card: #FFFFFF;
    --card-border: #EDE4D8;
    --input-bg: #FDFBF7;
    --input-border: #E5DACB;
    --accent: #C4635A;
    --accent-text: #FBF7F0;
    --warn: #C97A2B;
  }
  html[data-theme="dark"] {
    --bg: #211D1A;
    --text: #F1EAE3;
    --muted: #B3A69B;
    --muted-light: #8A7A72;
    --card: #2B2622;
    --card-border: #3D362F;
    --input-bg: #26221E;
    --input-border: #3D362F;
    --accent-text: #211D1A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    transition: background 0.2s, color 0.2s;
  }
  .font-display { font-family: 'Fraunces', serif; }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: calc(48px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .icon-badge {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  h1 {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .subtitle {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 28px 52px;
  }

  /* settings */
  .settings-wrap { position: relative; }
  .settings-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .settings-btn:hover { color: var(--text); border-color: var(--accent); }
  .settings-panel {
    position: absolute;
    right: 0;
    top: 46px;
    width: 240px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    z-index: 20;
    display: none;
  }
  .settings-panel.open { display: block; }
  .settings-section { margin-bottom: 16px; }
  .settings-section:last-child { margin-bottom: 0; }
  .settings-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted-light);
    margin: 0 0 8px;
  }
  .swatches { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    padding: 0;
    flex-shrink: 0;
  }
  .swatch.active { border-color: var(--text); }
  .color-input-wrap {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    border: 1px dashed var(--muted-light);
    flex-shrink: 0;
  }
  .color-input-wrap input[type="color"] {
    position: absolute;
    top: -4px; left: -4px;
    width: 32px; height: 32px;
    border: none;
    cursor: pointer;
    background: none;
    padding: 0;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .toggle-row span { font-size: 13px; }
  .switch {
    width: 36px;
    height: 20px;
    border-radius: 999px;
    background: var(--input-border);
    position: relative;
    cursor: pointer;
    border: none;
    padding: 0;
    flex-shrink: 0;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: white;
    transition: left 0.15s;
  }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 18px; }
  .lang-toggle { display: flex; gap: 6px; }
  .lang-btn {
    flex: 1;
    padding: 6px 0;
    border-radius: 8px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--muted);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .lang-btn.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  .add-btn {
    width: 100%;
    padding: 13px 0;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
    transition: filter 0.15s;
  }
  .add-btn:hover { filter: brightness(0.94); }

  .empty-state, .loading-state {
    text-align: center;
    padding: 60px 0;
    color: var(--muted-light);
    font-size: 14px;
  }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 16px 18px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: var(--card);
    transition: border-color 0.15s;
    cursor: pointer;
  }
  .row:hover { border-color: color-mix(in srgb, var(--accent) 30%, var(--card-border)); }
  .row.today {
    background: color-mix(in srgb, var(--accent) 12%, var(--bg));
    border-color: color-mix(in srgb, var(--accent) 40%, var(--card-border));
  }
  .row.inactive {
    background: color-mix(in srgb, var(--warn) 8%, var(--bg));
    border-color: color-mix(in srgb, var(--warn) 30%, var(--card-border));
  }
  .row-left {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    min-width: 0;
    flex: 1 1 220px;
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--accent) 14%, var(--card));
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .row.today .avatar {
    background: var(--accent);
    color: var(--accent-text);
  }
  .info { min-width: 0; flex: 1; }
  .cust-name-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .cust-name {
    font-weight: 600;
    font-size: 14px;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .notes-dot {
    color: var(--muted-light);
    font-size: 12px;
    flex-shrink: 0;
  }
  .category-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }
  .category-badge.new { background: color-mix(in srgb, #5B5FC7 18%, var(--card)); color: #5B5FC7; }
  .category-badge.regular { background: color-mix(in srgb, var(--muted) 16%, var(--card)); color: var(--muted); }
  .category-badge.vip { background: color-mix(in srgb, #C08A2E 22%, var(--card)); color: #C08A2E; }
  .cust-meta {
    font-size: 12px;
    color: var(--muted);
    margin: 3px 0 0;
    line-height: 1.5;
  }
  .cust-meta.product-line {
    color: var(--text);
    opacity: 0.75;
  }
  .cust-meta.warn-line {
    color: var(--warn);
    font-weight: 600;
    opacity: 1;
  }
  .row-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .days-left {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted-light);
    margin-right: 4px;
    white-space: nowrap;
  }
  .row.today .days-left { color: var(--accent); }
  .icon-btn {
    background: none;
    border: none;
    color: var(--muted-light);
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    transition: color 0.15s, background 0.15s;
  }
  .icon-btn:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .icon-btn.whatsapp-icon:hover { color: #25D366; }

  .footer-count {
    text-align: center;
    font-size: 12px;
    color: var(--muted-light);
    margin-top: 32px;
  }

  /* modal shared */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
    overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--card);
    border-radius: 18px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 16px 48px rgba(0,0,0,0.2);
    margin: auto;
  }
  .modal-title {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
    font-family: 'Fraunces', serif;
  }
  .modal-subtitle {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .field-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted-light);
    margin: 14px 0 6px;
    display: block;
  }
  .field-label:first-of-type { margin-top: 4px; }
  input[type="text"], input[type="date"], input[type="tel"], textarea {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    outline: none;
  }
  textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
  input:focus, textarea:focus {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  input::placeholder, textarea::placeholder { color: var(--muted-light); }

  .emoji-row { display: flex; align-items: center; gap: 10px; }
  .emoji-wrap { position: relative; flex-shrink: 0; }
  .emoji-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    font-size: 19px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .emoji-panel {
    position: absolute;
    left: 0;
    top: 48px;
    width: 220px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    z-index: 30;
    display: none;
  }
  .emoji-panel.open { display: block; }
  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .emoji-option {
    font-size: 18px;
    background: none;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    padding: 4px 0;
  }
  .emoji-option:hover, .emoji-option.active { background: var(--input-bg); }
  .emoji-custom {
    display: flex;
    gap: 6px;
    border-top: 1px solid var(--card-border);
    padding-top: 10px;
  }
  .emoji-custom input {
    flex: 1;
    min-width: 0;
    padding: 6px 10px;
    font-size: 14px;
  }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .category-toggle {
    display: flex;
    gap: 6px;
  }
  .category-btn {
    flex: 1;
    padding: 8px 0;
    border-radius: 10px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .category-btn.active.new { background: color-mix(in srgb, #5B5FC7 18%, var(--input-bg)); color: #5B5FC7; border-color: #5B5FC7; }
  .category-btn.active.regular { background: color-mix(in srgb, var(--muted) 20%, var(--input-bg)); color: var(--text); border-color: var(--muted); }
  .category-btn.active.vip { background: color-mix(in srgb, #C08A2E 20%, var(--input-bg)); color: #C08A2E; border-color: #C08A2E; }

  .error-msg {
    font-size: 12px;
    color: var(--accent);
    margin: 10px 0 0;
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
  }
  .modal-actions button {
    flex: 1;
    padding: 10px 0;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .modal-actions button.primary-btn {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  .modal-actions button:hover { filter: brightness(0.96); }
  .delete-row-btn {
    width: 100%;
    margin-top: 10px;
    padding: 9px 0;
    border-radius: 12px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--muted-light);
    text-align: center;
  }
  .delete-row-btn:hover { color: var(--accent); }

  .modal-textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
    outline: none;
  }
  .whatsapp-btn {
    width: 100%;
    margin-top: 12px;
    padding: 10px 0;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: #25D366;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .whatsapp-btn:hover { filter: brightness(0.95); }
  .no-phone-hint {
    font-size: 12px;
    color: var(--muted-light);
    text-align: center;
    margin: 10px 0 0;
  }
  .modal-close {
    display: block;
    margin: 12px auto 0;
    background: none;
    border: none;
    color: var(--muted-light);
    font-size: 12px;
    cursor: pointer;
    padding: 4px;
  }
  .modal-close:hover { color: var(--muted); }

  /* purchases section (edit modal) */
  .purchases-section {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--card-border);
  }
  .purchase-row {
    position: relative;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .purchase-remove {
    position: absolute;
    top: 8px;
    right: 8px;
    background: none;
    border: none;
    color: var(--muted-light);
    cursor: pointer;
    padding: 4px;
    display: flex;
    border-radius: 6px;
  }
  .purchase-remove:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .purchase-row textarea.product-textarea {
    min-height: 70px;
  }
  .purchase-row textarea.purchase-note-textarea {
    min-height: 50px;
  }
  .amount-wrap {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--input-border);
    border-radius: 12px;
    background: var(--input-bg);
    overflow: hidden;
  }
  .amount-wrap .rm-prefix {
    display: flex;
    align-items: center;
    padding: 0 4px 0 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
    background: color-mix(in srgb, var(--accent) 8%, var(--input-bg));
  }
  .amount-wrap input {
    border: none !important;
    background: transparent !important;
    box-shadow: none !important;
    padding-left: 6px;
  }
  .add-purchase-btn {
    width: 100%;
    padding: 10px 0;
    border-radius: 12px;
    border: 1px dashed var(--input-border);
    background: none;
    color: var(--muted);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 4px;
  }
  .add-purchase-btn:hover { color: var(--accent); border-color: var(--accent); }
  .no-purchases-hint {
    font-size: 12px;
    color: var(--muted-light);
    text-align: center;
    padding: 10px 0;
  }

  /* customer detail (view) modal */
  .detail-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .detail-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--accent) 14%, var(--card));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .detail-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .detail-name { font-size: 17px; font-weight: 600; margin: 0; font-family: 'Fraunces', serif; }
  .detail-info-line {
    font-size: 13px;
    color: var(--muted);
    margin: 2px 0 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .detail-warn-banner {
    font-size: 12px;
    font-weight: 600;
    color: var(--warn);
    background: color-mix(in srgb, var(--warn) 12%, var(--card));
    border-radius: 10px;
    padding: 8px 12px;
    margin: 12px 0;
  }
  .detail-notes-box {
    font-size: 13px;
    color: var(--text);
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 12px;
    padding: 10px 12px;
    margin: 6px 0 0;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .detail-section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 18px 0 8px;
  }
  .history-item {
    border-left: 2px solid var(--card-border);
    padding: 2px 0 14px 14px;
    margin-left: 4px;
    position: relative;
  }
  .history-item::before {
    content: "";
    position: absolute;
    left: -5px;
    top: 4px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }
  .history-item:last-child { padding-bottom: 0; }
  .history-date {
    font-size: 11px;
    color: var(--muted-light);
    font-weight: 600;
  }
  .history-product {
    font-size: 14px;
    color: var(--text);
    margin: 2px 0 0;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .history-amount {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    margin-top: 2px;
  }
  .history-note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    background: var(--input-bg);
    border-radius: 8px;
    padding: 6px 10px;
    white-space: pre-wrap;
  }

  @media (max-width: 480px) {
    .two-col { grid-template-columns: 1fr; }
  }
</style>

  document.documentElement.lang = prefs.lang === "zh" ? "zh-CN" : "en";

}

function daysUntilNextBirthday(dateStr) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const [, m, d] = dateStr.split("-").map(Number);
  let next = new Date(today.getFullYear(), m - 1, d);
  if (next < today) next = new Date(today.getFullYear() + 1, m - 1, d);
  return Math.round((next - today) / 86400000);
}

function ageTurning(dateStr) {
  const today = new Date();
  const [y, m, d] = dateStr.split("-").map(Number);
  let next = new Date(today.getFullYear(), m - 1, d);
  if (next < today) next.setFullYear(today.getFullYear() + 1);
  return next.getFullYear() - y;
}

function lastPurchaseDate(purchases) {
  const dates = (purchases || [])
    .map(p => p.date)
    .filter(d => d && /^\d{4}-\d{2}-\d{2}$/.test(d))
    .map(d => new Date(d));
  if (dates.length === 0) return null;
  return new Date(Math.max(...dates.map(d => d.getTime())));
}

function daysSince(date) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const d = new Date(date);
  d.setHours(0,0,0,0);
  return Math.round((today - d) / 86400000);
}

const contentEl = document.getElementById("content");
const footerEl = document.getElementById("footerCount");

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function escapeAttr(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function render() {
  const s = t();
  if (customers.length === 0) {
    contentEl.innerHTML = `<div class="empty-state">${s.empty}</div>`;
    footerEl.style.display = "none";
    return;
  }

  const sorted = [...customers]
    .map(c => ({ ...c, days: daysUntilNextBirthday(c.date) }))
    .sort((a, b) => a.days - b.days);

  const rows = sorted.map(c => {
    const isToday = c.days === 0;
    const [, mm, dd] = c.date.split("-").map(Number);
    const purchases = Array.isArray(c.purchases) ? c.purchases : [];
    const category = c.category || "new";

    let purchaseLine = "";
    if (purchases.length > 0) {
      const total = purchases.reduce((sum, p) => {
        const n = parseFloat(String(p.amount).replace(/[^\d.]/g, ""));
        return sum + (isNaN(n) ? 0 : n);
      }, 0);
      const totalStr = Number.isInteger(total) ? String(total) : total.toFixed(2);
      purchaseLine = `<p class="cust-meta product-line">${s.purchasesSummary(purchases.length, totalStr)}</p>`;
    }

    let isInactive = false;
    const lastDate = lastPurchaseDate(purchases);
    if (lastDate && daysSince(lastDate) >= INACTIVE_DAYS_THRESHOLD) {
      isInactive = true;
    }
    const warnLine = isInactive ? `<p class="cust-meta warn-line">${s.inactiveWarning}</p>` : "";

    const whatsappIcon = c.phone
      ? `<button class="icon-btn whatsapp-icon" onclick="event.stopPropagation(); openWhatsAppChat('${c.id}')" aria-label="${s.whatsappChatLabel}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.86 9.86 0 0 0 12.04 2zm5.8 14.15c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.11.11-1.79-.11a13 13 0 0 1-1.86-.7c-2.83-1.22-4.67-4.08-4.81-4.27-.14-.19-1.15-1.53-1.15-2.92 0-1.39.73-2.07.98-2.35.26-.28.56-.35.75-.35.19 0 .37 0 .53.01.17.01.4-.06.62.48.24.58.8 2 .87 2.14.07.14.12.31.02.5-.09.19-.14.31-.28.47-.14.16-.29.36-.42.48-.14.14-.28.29-.12.57.16.28.71 1.18 1.53 1.91 1.05.94 1.94 1.24 2.22 1.38.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.19-.28.37-.23.62-.14.26.09 1.63.77 1.91.91.28.14.47.21.53.33.07.12.07.68-.17 1.36z"/></svg>
        </button>`
      : "";

    return `
      <div class="row ${isToday ? "today" : ""} ${isInactive ? "inactive" : ""}" onclick="openDetailModal('${c.id}')">
        <div class="row-left">
          <div class="avatar">${c.emoji || "👤"}</div>
          <div class="info">
            <div class="cust-name-row">
              <p class="cust-name">${escapeHtml(c.name)}</p>
              <span class="category-badge ${category}">${categoryLabel(category)}</span>
              ${c.notes ? `<span class="notes-dot" title="${escapeAttr(c.notes)}">📝</span>` : ""}
            </div>
            <p class="cust-meta">${s.monthDay(mm, dd)} · ${s.willTurn(ageTurning(c.date))}${c.phone ? " · " + escapeHtml(c.phone) : ""}</p>
            ${purchaseLine}
            ${warnLine}
          </div>
        </div>
        <div class="row-right">
          <span class="days-left">${isToday ? s.todayBirthday : s.daysAfter(c.days)}</span>
          ${whatsappIcon}
          <button class="icon-btn" onclick="event.stopPropagation(); openWishModal('${c.id}')" aria-label="${s.sendWishLabel}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          </button>
          <button class="icon-btn" onclick="event.stopPropagation(); openEditModal('${c.id}')" aria-label="${s.editLabel}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
          </button>
        </div>
      </div>`;
  }).join("");

  contentEl.innerHTML = `<div class="list">${rows}</div>`;
  footerEl.style.display = "block";
  footerEl.textContent = s.footerCount(sorted.length);
}

  try {

function openWhatsAppChat(id) {
  const c = customers.find(x => x.id === id);

  const digits = c.phone.replace(/[^\d+]/g, "").replace(/^\+/, "");

const nameInput = document.getElementById("nameInput");
const phoneInput = document.getElementById("phoneInput");
const dateInput = document.getElementById("dateInput");
const notesInput = document.getElementById("notesInput");
const errorMsg = document.getElementById("errorMsg");
const deleteCustomerBtn = document.getElementById("deleteCustomerBtn");
const purchasesList = document.getElementById("purchasesList");

let selectedEmoji = "👤";
let selectedCategory = "new";
let editingId = null;
let purchaseRows = []; // { key, date, product, amount, note }
let purchaseKeyCounter = 0;

function setCategory(cat) {
  selectedCategory = cat;
  document.querySelectorAll(".category-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.category === cat);
    btn.classList.toggle(btn.dataset.category, btn.dataset.category === cat);
  });
}

document.querySelectorAll(".category-btn").forEach(btn => {
  btn.addEventListener("click", () => setCategory(btn.dataset.category));
});

function syncPurchaseRowsFromDOM() {
  purchaseRows.forEach(row => {
    const dateEl = document.getElementById(`p-date-${row.key}`);
    const productEl = document.getElementById(`p-product-${row.key}`);
    const amountEl = document.getElementById(`p-amount-${row.key}`);
    const noteEl = document.getElementById(`p-note-${row.key}`);
    if (dateEl) row.date = dateEl.value;
    if (productEl) row.product = productEl.value;
    if (amountEl) row.amount = amountEl.value;
    if (noteEl) row.note = noteEl.value;
  });
}

function renderPurchaseRows() {
  if (!purchasesList) return;
  syncPurchaseRowsFromDOM();
  const s = t();
  if (purchaseRows.length === 0) {
    purchasesList.innerHTML = `<p class="no-purchases-hint">${s.noPurchasesHint}</p>`;
    return;
  }
  purchasesList.innerHTML = purchaseRows.map(row => `
    <div class="purchase-row" data-key="${row.key}">
      <button type="button" class="purchase-remove" onclick="removePurchaseRow(${row.key})" aria-label="${s.removePurchaseLabel}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
      </button>
      <div class="two-col">
        <div>
          <label class="field-label" style="margin-top:0;">${s.purchaseDateLabel}</label>
          <input type="date" id="p-date-${row.key}" value="${escapeAttr(row.date)}" />
        </div>
        <div>
          <label class="field-label" style="margin-top:0;">${s.purchaseAmountLabel}</label>
          <div class="amount-wrap">
            <span class="rm-prefix">RM</span>
            <input type="text" inputmode="decimal" id="p-amount-${row.key}" value="${escapeAttr(row.amount)}" placeholder="${escapeAttr(s.amountPlaceholder)}" />
          </div>
        </div>
      </div>
      <label class="field-label">${s.purchaseProductLabel}</label>
      <textarea class="product-textarea" id="p-product-${row.key}" placeholder="${escapeAttr(s.productPlaceholder)}">${escapeHtml(row.product)}</textarea>
      <label class="field-label">${s.purchaseNoteLabel}</label>
      <textarea class="purchase-note-textarea" id="p-note-${row.key}" placeholder="${escapeAttr(s.purchaseNotePlaceholder)}">${escapeHtml(row.note)}</textarea>
    </div>
  `).join("");
}

function addPurchaseRow(initial) {
  initial = initial || {};
  syncPurchaseRowsFromDOM();
  purchaseKeyCounter += 1;
  purchaseRows.push({
    key: purchaseKeyCounter,
    date: initial.date || "",
    product: initial.product || "",
    amount: initial.amount || "",
    note: initial.note || "",
  });
  renderPurchaseRows();
}

function removePurchaseRow(key) {
  syncPurchaseRowsFromDOM();
  purchaseRows = purchaseRows.filter(r => r.key !== key);
  renderPurchaseRows();
}

document.getElementById("addPurchaseBtn").addEventListener("click", () => addPurchaseRow());

function resetCustomerForm() {
  nameInput.value = "";
  phoneInput.value = "";
  dateInput.value = "";
  notesInput.value = "";
  purchaseRows = [];
  renderPurchaseRows();
  selectedEmoji = "👤";
  document.getElementById("emojiBtn").textContent = selectedEmoji;
  document.getElementById("customEmojiInput").value = "";
  document.querySelectorAll(".emoji-option").forEach(b => b.classList.toggle("active", b.dataset.emoji === selectedEmoji));
  setCategory("new");
  errorMsg.style.display = "none";
}

function openAddModal() {
  const s = t();
  editingId = null;
  resetCustomerForm();
  customerModalTitle.textContent = s.modalAddTitle;
  deleteCustomerBtn.style.display = "none";
  customerOverlay.classList.add("open");
}

function openEditModal(id) {
  const c = customers.find(x => x.id === id);
  if (!c) return;
  const s = t();
  editingId = id;
  errorMsg.style.display = "none";
  nameInput.value = c.name || "";
  phoneInput.value = c.phone || "";
  dateInput.value = c.date || "";
  notesInput.value = c.notes || "";
  purchaseRows = (Array.isArray(c.purchases) ? c.purchases : []).map(p => {
    purchaseKeyCounter += 1;
    return { key: purchaseKeyCounter, date: p.date || "", product: p.product || "", amount: p.amount || "", note: p.note || "" };
  });
  renderPurchaseRows();
  selectedEmoji = c.emoji || "👤";
  document.getElementById("emojiBtn").textContent = selectedEmoji;
  document.getElementById("customEmojiInput").value = "";
  document.querySelectorAll(".emoji-option").forEach(b => b.classList.toggle("active", b.dataset.emoji === selectedEmoji));
  setCategory(c.category || "new");
  customerModalTitle.textContent = s.modalEditTitle;
  deleteCustomerBtn.style.display = "block";
  customerOverlay.classList.add("open");
}

function closeCustomerModal() {
  customerOverlay.classList.remove("open");
  document.getElementById("emojiPanel").classList.remove("open");
}

document.getElementById("openAddBtn").addEventListener("click", openAddModal);
document.getElementById("cancelCustomerBtn").addEventListener("click", closeCustomerModal);
customerOverlay.addEventListener("click", (e) => {
  if (e.target === customerOverlay) closeCustomerModal();
});

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = "block";
}

async function saveCustomer() {
  const s = t();
  const name = nameInput.value.trim();
  const phone = phoneInput.value.trim();
  const date = dateInput.value;
  const notes = notesInput.value.trim();
  errorMsg.style.display = "none";

  if (!name) { showError(s.errorName); return; }
  if (!date) { showError(s.errorDate); return; }
  if (phone && !/^[+\d][\d\s\-()]{4,}$/.test(phone)) { showError(s.errorPhone); return; }

  syncPurchaseRowsFromDOM();
  const purchases = purchaseRows
    .map(r => ({ date: r.date.trim(), product: r.product.trim(), amount: r.amount.trim(), note: r.note.trim() }))
    .filter(p => p.date || p.product || p.amount || p.note);

  const payload = { name, date, phone, emoji: selectedEmoji, purchases, notes, category: selectedCategory };

  try {
    let res, saved;
    if (editingId) {
      res = await fetch(`${API}/${editingId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
    } else {
      res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
    }
    if (!res.ok) {
      const data = await res.json();
      showError(data.error || s.errorAdd);
      return;
    }
    saved = await res.json();
    if (editingId) {
      customers = customers.map(c => c.id === editingId ? saved : c);
    } else {
      customers.push(saved);
    }
    closeCustomerModal();
    render();
  } catch (e) {
    showError(s.errorNetwork);
  }
}

document.getElementById("saveCustomerBtn").addEventListener("click", saveCustomer);

deleteCustomerBtn.addEventListener("click", async () => {
  const s = t();
  if (!editingId) return;
  if (!confirm(s.deleteConfirm)) return;
  try {
    await fetch(`${API}/${editingId}`, { method: "DELETE" });
    customers = customers.filter(c => c.id !== editingId);
    closeCustomerModal();
    render();
  } catch (e) {
    alert(s.deleteFailed);
  }
});

[nameInput, phoneInput, dateInput].forEach(el => {
  el.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); saveCustomer(); } });
});

const wishOverlay = document.getElementById("wishOverlay");
const wishSubtitleEl = document.getElementById("wishSubtitle");

const copyBtn = document.getElementById("copyBtn");
const copyLabelEl = document.getElementById("copyLabel");
const whatsappBtn = document.getElementById("whatsappBtn");
const noPhoneHint = document.getElementById("noPhoneHint");
let wishCustomerName = "";
let wishCustomerPhone = "";

function pickWish() {
  const s = t();
  const templates = s.wishes;
  const msg = templates[Math.floor(Math.random() * templates.length)](wishCustomerName);
  wishTextarea.value = msg;
}

function openWishModal(id) {
  const c = customers.find(x => x.id === id);
  if (!c) return;
  const s = t();
  wishCustomerName = c.name;
  wishCustomerPhone = c.phone || "";
  wishSubtitleEl.textContent = s.wishSubtitle(c.name);
  copyLabelEl.textContent = s.copy;

    whatsappBtn.style.display = "flex";
    noPhoneHint.style.display = "none";
  } else {
    whatsappBtn.style.display = "none";
    noPhoneHint.style.display = "block";

}

function closeWishModal() {
  wishOverlay.classList.remove("open");

document.getElementById("wishCloseBtn").addEventListener("click", closeWishModal);
wishOverlay.addEventListener("click", (e) => {
  if (e.target === wishOverlay) closeWishModal();
});

copyBtn.addEventListener("click", async () => {
  const s = t();
  try {
    await navigator.clipboard.writeText(wishTextarea.value);
  } catch (e) {
    wishTextarea.select();
    document.execCommand("copy");
  }
  copyLabelEl.textContent = s.copied;
  setTimeout(() => { copyLabelEl.textContent = s.copy; }, 1500);
});

whatsappBtn.addEventListener("click", () => {
  if (!wishCustomerPhone) return;
  const digits = wishCustomerPhone.replace(/[^\d+]/g, "").replace(/^\+/, "");
  const url = `https://wa.me/${digits}?text=${encodeURIComponent(wishTextarea.value)}`;
  window.open(url, "_blank");
});

setCategory("new");
applyPrefs();
loadCustomers();
