<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>顾客生日簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF7F0;
    --text: #3A2E2A;
    --muted: #8A7A72;
    --muted-light: #B3A69B;
    --card: #FFFFFF;
    --card-border: #EDE4D8;
    --input-bg: #FDFBF7;
    --input-border: #E5DACB;
    --accent: #C4635A;
    --accent-text: #FBF7F0;
  }
  html[data-theme="dark"] {
    --bg: #211D1A;
    --text: #F1EAE3;
    --muted: #B3A69B;
    --muted-light: #8A7A72;
    --card: #2B2622;
    --card-border: #3D362F;
    --input-bg: #26221E;
    --input-border: #3D362F;
    --accent-text: #211D1A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    transition: background 0.2s, color 0.2s;
  }
  .font-display { font-family: 'Fraunces', serif; }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .icon-badge {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  h1 {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .subtitle {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 28px 52px;
  }

  /* settings */
  .settings-wrap { position: relative; }
  .settings-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .settings-btn:hover { color: var(--text); border-color: var(--accent); }
  .settings-panel {
    position: absolute;
    right: 0;
    top: 46px;
    width: 240px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    z-index: 20;
    display: none;
  }
  .settings-panel.open { display: block; }
  .settings-section { margin-bottom: 16px; }
  .settings-section:last-child { margin-bottom: 0; }
  .settings-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted-light);
    margin: 0 0 8px;
  }
  .swatches { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    padding: 0;
    flex-shrink: 0;
  }
  .swatch.active { border-color: var(--text); }
  .color-input-wrap {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    border: 1px dashed var(--muted-light);
    flex-shrink: 0;
  }
  .color-input-wrap input[type="color"] {
    position: absolute;
    top: -4px; left: -4px;
    width: 32px; height: 32px;
    border: none;
    cursor: pointer;
    background: none;
    padding: 0;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .toggle-row span { font-size: 13px; }
  .switch {
    width: 36px;
    height: 20px;
    border-radius: 999px;
    background: var(--input-border);
    position: relative;
    cursor: pointer;
    border: none;
    padding: 0;
    flex-shrink: 0;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: white;
    transition: left 0.15s;
  }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 18px; }
  .lang-toggle { display: flex; gap: 6px; }
  .lang-btn {
    flex: 1;
    padding: 6px 0;
    border-radius: 8px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--muted);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .lang-btn.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  .add-btn {
    width: 100%;
    padding: 13px 0;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
    transition: filter 0.15s;
  }
  .add-btn:hover { filter: brightness(0.94); }

  .empty-state, .loading-state {
    text-align: center;
    padding: 60px 0;
    color: var(--muted-light);
    font-size: 14px;
  }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 16px 18px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: var(--card);
    transition: border-color 0.15s;
  }
  .row:hover { border-color: color-mix(in srgb, var(--accent) 30%, var(--card-border)); }
  .row.today {
    background: color-mix(in srgb, var(--accent) 12%, var(--bg));
    border-color: color-mix(in srgb, var(--accent) 40%, var(--card-border));
  }
  .row-left {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    min-width: 0;
    flex: 1 1 220px;
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--accent) 14%, var(--card));
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .row.today .avatar {
    background: var(--accent);
    color: var(--accent-text);
  }
  .info { min-width: 0; }
  .cust-name-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cust-name {
    font-weight: 600;
    font-size: 14px;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .notes-dot {
    color: var(--muted-light);
    font-size: 12px;
    flex-shrink: 0;
  }
  .cust-meta {
    font-size: 12px;
    color: var(--muted);
    margin: 3px 0 0;
    line-height: 1.5;
  }
  .cust-meta.product-line {
    color: var(--text);
    opacity: 0.75;
  }
  .row-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .days-left {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted-light);
    margin-right: 4px;
    white-space: nowrap;
  }
  .row.today .days-left { color: var(--accent); }
  .icon-btn {
    background: none;
    border: none;
    color: var(--muted-light);
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    transition: color 0.15s, background 0.15s;
  }
  .icon-btn:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .icon-btn.whatsapp-icon:hover { color: #25D366; }

  .footer-count {
    text-align: center;
    font-size: 12px;
    color: var(--muted-light);
    margin-top: 32px;
  }

  /* modal shared */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
    overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--card);
    border-radius: 18px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 16px 48px rgba(0,0,0,0.2);
    margin: auto;
  }
  .modal-title {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
    font-family: 'Fraunces', serif;
  }
  .modal-subtitle {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .field-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted-light);
    margin: 14px 0 6px;
    display: block;
  }
  .field-label:first-of-type { margin-top: 4px; }
  input[type="text"], input[type="date"], input[type="tel"], textarea {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    outline: none;
  }
  textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
  input:focus, textarea:focus {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  input::placeholder, textarea::placeholder { color: var(--muted-light); }

  .emoji-row { display: flex; align-items: center; gap: 10px; }
  .emoji-wrap { position: relative; flex-shrink: 0; }
  .emoji-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    font-size: 19px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .emoji-panel {
    position: absolute;
    left: 0;
    top: 48px;
    width: 220px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    z-index: 30;
    display: none;
  }
  .emoji-panel.open { display: block; }
  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .emoji-option {
    font-size: 18px;
    background: none;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    padding: 4px 0;
  }
  .emoji-option:hover, .emoji-option.active { background: var(--input-bg); }
  .emoji-custom {
    display: flex;
    gap: 6px;
    border-top: 1px solid var(--card-border);
    padding-top: 10px;
  }
  .emoji-custom input {
    flex: 1;
    min-width: 0;
    padding: 6px 10px;
    font-size: 14px;
  }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .error-msg {
    font-size: 12px;
    color: var(--accent);
    margin: 10px 0 0;
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
  }
  .modal-actions button {
    flex: 1;
    padding: 10px 0;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .modal-actions button.primary-btn {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  .modal-actions button:hover { filter: brightness(0.96); }
  .delete-row-btn {
    width: 100%;
    margin-top: 10px;
    padding: 9px 0;
    border-radius: 12px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--muted-light);
    text-align: center;
  }
  .delete-row-btn:hover { color: var(--accent); }

  .modal-textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
    outline: none;
  }
  .whatsapp-btn {
    width: 100%;
    margin-top: 12px;
    padding: 10px 0;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: #25D366;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .whatsapp-btn:hover { filter: brightness(0.95); }
  .no-phone-hint {
    font-size: 12px;
    color: var(--muted-light);
    text-align: center;
    margin: 10px 0 0;
  }
  .modal-close {
    display: block;
    margin: 12px auto 0;
    background: none;
    border: none;
    color: var(--muted-light);
    font-size: 12px;
    cursor: pointer;
    padding: 4px;
  }
  .modal-close:hover { color: var(--muted); }

  @media (max-width: 480px) {
    .two-col { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="header-left">
        <div class="icon-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v3"/><path d="M12 8v3"/><path d="M17 8v3"/><path d="M7 4h.01"/><path d="M12 4h.01"/><path d="M17 4h.01"/></svg>
        </div>
        <h1 class="font-display" id="title">顾客生日簿</h1>
      </div>
      <div class="settings-wrap">
        <button class="settings-btn" id="settingsBtn" aria-label="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <div class="settings-panel" id="settingsPanel">
          <div class="settings-section">
            <p class="settings-label" id="colorLabel">颜色</p>
            <div class="swatches" id="swatches">
              <button class="swatch active" data-color="#C4635A" style="background:#C4635A"></button>
              <button class="swatch" data-color="#2F8F84" style="background:#2F8F84"></button>
              <button class="swatch" data-color="#5B5FC7" style="background:#5B5FC7"></button>
              <button class="swatch" data-color="#C74B7A" style="background:#C74B7A"></button>
              <button class="swatch" data-color="#C08A2E" style="background:#C08A2E"></button>
              <button class="swatch" data-color="#4C7A3D" style="background:#4C7A3D"></button>
              <div class="color-input-wrap" title="自定义颜色">
                <input type="color" id="customColor" value="#C4635A" />
              </div>
            </div>
          </div>
          <div class="settings-section">
            <div class="toggle-row">
              <span id="darkModeLabel">深色模式</span>
              <button class="switch" id="darkToggle" aria-label="深色模式"></button>
            </div>
          </div>
          <div class="settings-section">
            <p class="settings-label" id="langLabel">语言</p>
            <div class="lang-toggle">
              <button class="lang-btn" data-lang="zh">中文</button>
              <button class="lang-btn" data-lang="en">English</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <p class="subtitle" id="subtitle">记录每一位顾客的生日,不错过任何一个惊喜的理由</p>

    <button class="add-btn" id="openAddBtn" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      <span id="addBtnLabel">添加顾客</span>
    </button>

    <div id="content">
      <div class="loading-state" id="loadingLabel">加载中…</div>
    </div>

    <p class="footer-count" id="footerCount" style="display:none;"></p>
  </div>

  <!-- Add / Edit customer modal -->
  <div class="modal-overlay" id="customerOverlay">
    <div class="modal-box">
      <p class="modal-title" id="customerModalTitle">添加顾客</p>
      <p class="modal-subtitle" id="customerModalSubtitle">记录顾客的资料,之后随时可以修改</p>

      <div class="emoji-row">
        <div class="emoji-wrap">
          <button class="emoji-btn" id="emojiBtn" type="button">🎂</button>
          <div class="emoji-panel" id="emojiPanel">
            <div class="emoji-grid" id="emojiGrid">
              <button class="emoji-option active" data-emoji="🎂">🎂</button>
              <button class="emoji-option" data-emoji="🎉">🎉</button>
              <button class="emoji-option" data-emoji="🎈">🎈</button>
              <button class="emoji-option" data-emoji="🥳">🥳</button>
              <button class="emoji-option" data-emoji="🎁">🎁</button>
              <button class="emoji-option" data-emoji="🌟">🌟</button>
              <button class="emoji-option" data-emoji="❤️">❤️</button>
              <button class="emoji-option" data-emoji="🌸">🌸</button>
              <button class="emoji-option" data-emoji="😊">😊</button>
              <button class="emoji-option" data-emoji="👑">👑</button>
              <button class="emoji-option" data-emoji="🍀">🍀</button>
              <button class="emoji-option" data-emoji="⭐">⭐</button>
            </div>
            <div class="emoji-custom">
              <input id="customEmojiInput" type="text" maxlength="8" placeholder="输入任意 emoji" />
            </div>
          </div>
        </div>
        <div style="flex:1;">
          <input id="nameInput" type="text" />
        </div>
      </div>

      <label class="field-label" id="phoneFieldLabel">电话号码</label>
      <input id="phoneInput" type="tel" />

      <label class="field-label" id="birthdayFieldLabel">生日</label>
      <input id="dateInput" type="date" />

      <div class="two-col">
        <div>
          <label class="field-label" id="productFieldLabel">购买产品</label>
          <input id="productInput" type="text" />
        </div>
        <div>
          <label class="field-label" id="amountFieldLabel">金额</label>
          <input id="amountInput" type="text" />
        </div>
      </div>

      <label class="field-label" id="notesFieldLabel">备注</label>
      <textarea id="notesInput"></textarea>

      <p class="error-msg" id="errorMsg" style="display:none;"></p>

      <div class="modal-actions">
        <button id="cancelCustomerBtn" type="button"><span id="cancelLabel">取消</span></button>
        <button class="primary-btn" id="saveCustomerBtn" type="button"><span id="saveLabel">保存</span></button>
      </div>
      <button class="delete-row-btn" id="deleteCustomerBtn" type="button" style="display:none;">
        <span id="deleteCustomerLabel">删除这位顾客</span>
      </button>
    </div>
  </div>

  <!-- Birthday wish modal -->
  <div class="modal-overlay" id="wishOverlay">
    <div class="modal-box">
      <p class="modal-title" id="wishTitle">送祝福语</p>
      <p class="modal-subtitle" id="wishSubtitle"></p>
      <textarea class="modal-textarea" id="wishTextarea" readonly></textarea>

function daysUntilNextBirthday(dateStr) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const [, m, d] = dateStr.split("-").map(Number);
  let next = new Date(today.getFullYear(), m - 1, d);
  if (next < today) next = new Date(today.getFullYear() + 1, m - 1, d);
  return Math.round((next - today) / 86400000);
}

function ageTurning(dateStr) {
  const today = new Date();
  const [y, m, d] = dateStr.split("-").map(Number);
  let next = new Date(today.getFullYear(), m - 1, d);
  if (next < today) next.setFullYear(today.getFullYear() + 1);
  return next.getFullYear() - y;
}

const contentEl = document.getElementById("content");
const footerEl = document.getElementById("footerCount");

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function render() {
  const s = t();
  if (customers.length === 0) {
    contentEl.innerHTML = `<div class="empty-state">${s.empty}</div>`;
    footerEl.style.display = "none";
    return;
  }

  const sorted = [...customers]
    .map(c => ({ ...c, days: daysUntilNextBirthday(c.date) }))
    .sort((a, b) => a.days - b.days);

  const rows = sorted.map(c => {
    const isToday = c.days === 0;
    const [, mm, dd] = c.date.split("-").map(Number);
    const productLine = (c.product || c.amount)
      ? `<p class="cust-meta product-line">🛍 ${escapeHtml(c.product || "")}${c.product && c.amount ? " · " : ""}${escapeHtml(c.amount || "")}</p>`
      : "";
    const whatsappIcon = c.phone
      ? `<button class="icon-btn whatsapp-icon" onclick="openWhatsAppChat('${c.id}')" aria-label="${s.whatsappChatLabel}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.86 9.86 0 0 0 12.04 2zm5.8 14.15c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.11.11-1.79-.11a13 13 0 0 1-1.86-.7c-2.83-1.22-4.67-4.08-4.81-4.27-.14-.19-1.15-1.53-1.15-2.92 0-1.39.73-2.07.98-2.35.26-.28.56-.35.75-.35.19 0 .37 0 .53.01.17.01.4-.06.62.48.24.58.8 2 .87 2.14.07.14.12.31.02.5-.09.19-.14.31-.28.47-.14.16-.29.36-.42.48-.14.14-.28.29-.12.57.16.28.71 1.18 1.53 1.91 1.05.94 1.94 1.24 2.22 1.38.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.19-.28.37-.23.62-.14.26.09 1.63.77 1.91.91.28.14.47.21.53.33.07.12.07.68-.17 1.36z"/></svg>
        </button>`
      : "";
    return `
      <div class="row ${isToday ? "today" : ""}">
        <div class="row-left">
          <div class="avatar">${c.emoji || "🎂"}</div>
          <div class="info">
            <div class="cust-name-row">
              <p class="cust-name">${escapeHtml(c.name)}</p>
              ${c.notes ? `<span class="notes-dot" title="${escapeHtml(c.notes)}">📝</span>` : ""}
            </div>
            <p class="cust-meta">${s.monthDay(mm, dd)} · ${s.willTurn(ageTurning(c.date))}${c.phone ? " · " + escapeHtml(c.phone) : ""}</p>
            ${productLine}
          </div>
        </div>
        <div class="row-right">
          <span class="days-left">${isToday ? s.todayBirthday : s.daysAfter(c.days)}</span>
          ${whatsappIcon}
          <button class="icon-btn" onclick="openWishModal('${c.id}')" aria-label="${s.sendWishLabel}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          </button>
          <button class="icon-btn" onclick="openEditModal('${c.id}')" aria-label="${s.editLabel}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
          </button>
        </div>
      </div>`;
  }).join("");

  contentEl.innerHTML = `<div class="list">${rows}</div>`;
  footerEl.style.display = "block";
  footerEl.textContent = s.footerCount(sorted.length);
}

async function loadCustomers() {
  try {
    const res = await fetch(API);
    customers = await res.json();
    render();
  } catch (e) {
    contentEl.innerHTML = `<div class="empty-state">${t().loadFailed}</div>`;
  }
}

function openWhatsAppChat(id) {
  const c = customers.find(x => x.id === id);
  if (!c || !c.phone) return;
  const digits = c.phone.replace(/[^\d+]/g, "").replace(/^\+/, "");
  window.open(`https://wa.me/${digits}`, "_blank");
}

/* ---------- Add / Edit customer modal ---------- */
const customerOverlay = document.getElementById("customerOverlay");
const customerModalTitle = document.getElementById("customerModalTitle");
const nameInput = document.getElementById("nameInput");
const phoneInput = document.getElementById("phoneInput");
const dateInput = document.getElementById("dateInput");
const productInput = document.getElementById("productInput");
const amountInput = document.getElementById("amountInput");
const notesInput = document.getElementById("notesInput");
const errorMsg = document.getElementById("errorMsg");
const deleteCustomerBtn = document.getElementById("deleteCustomerBtn");

let selectedEmoji = "🎂";
let editingId = null;

function resetCustomerForm() {
  nameInput.value = "";
  phoneInput.value = "";
  dateInput.value = "";
  productInput.value = "";
  amountInput.value = "";
  notesInput.value = "";
  selectedEmoji = "🎂";
  document.getElementById("emojiBtn").textContent = selectedEmoji;
  document.getElementById("customEmojiInput").value = "";
  document.querySelectorAll(".emoji-option").forEach(b => b.classList.toggle("active", b.dataset.emoji === selectedEmoji));
  errorMsg.style.display = "none";
}

function openAddModal() {
  const s = t();
  editingId = null;
  resetCustomerForm();
  customerModalTitle.textContent = s.modalAddTitle;
  deleteCustomerBtn.style.display = "none";
  customerOverlay.classList.add("open");
}

function openEditModal(id) {
  const c = customers.find(x => x.id === id);
  if (!c) return;
  const s = t();
  editingId = id;
  errorMsg.style.display = "none";
  nameInput.value = c.name || "";
  phoneInput.value = c.phone || "";
  dateInput.value = c.date || "";
  productInput.value = c.product || "";
  amountInput.value = c.amount || "";
  notesInput.value = c.notes || "";
  selectedEmoji = c.emoji || "🎂";
  document.getElementById("emojiBtn").textContent = selectedEmoji;
  document.getElementById("customEmojiInput").value = "";
  document.querySelectorAll(".emoji-option").forEach(b => b.classList.toggle("active", b.dataset.emoji === selectedEmoji));
  customerModalTitle.textContent = s.modalEditTitle;
  deleteCustomerBtn.style.display = "block";
  customerOverlay.classList.add("open");
}

function closeCustomerModal() {
  customerOverlay.classList.remove("open");
  document.getElementById("emojiPanel").classList.remove("open");
}

document.getElementById("openAddBtn").addEventListener("click", openAddModal);
document.getElementById("cancelCustomerBtn").addEventListener("click", closeCustomerModal);
customerOverlay.addEventListener("click", (e) => {
  if (e.target === customerOverlay) closeCustomerModal();
});

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = "block";
}

async function saveCustomer() {
  const s = t();
  const name = nameInput.value.trim();
  const phone = phoneInput.value.trim();
  const date = dateInput.value;
  const product = productInput.value.trim();
  const amount = amountInput.value.trim();
  const notes = notesInput.value.trim();
  errorMsg.style.display = "none";

  if (!name) { showError(s.errorName); return; }
  if (!date) { showError(s.errorDate); return; }
  if (phone && !/^[+\d][\d\s\-()]{4,}$/.test(phone)) { showError(s.errorPhone); return; }

  const payload = { name, date, phone, emoji: selectedEmoji, product, amount, notes };

  try {
    let res, saved;
    if (editingId) {
      res = await fetch(`${API}/${editingId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
    } else {
      res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
    }
    if (!res.ok) {
      const data = await res.json();
      showError(data.error || s.errorAdd);
      return;
    }
    saved = await res.json();
    if (editingId) {
      customers = customers.map(c => c.id === editingId ? saved : c);
    } else {
      customers.push(saved);
    }
    closeCustomerModal();
    render();
  } catch (e) {
    showError(s.errorNetwork);
  }
}

document.getElementById("saveCustomerBtn").addEventListener("click", saveCustomer);

deleteCustomerBtn.addEventListener("click", async () => {
  const s = t();
  if (!editingId) return;
  if (!confirm(s.deleteConfirm)) return;
  try {
    await fetch(`${API}/${editingId}`, { method: "DELETE" });
    customers = customers.filter(c => c.id !== editingId);
    closeCustomerModal();
    render();
  } catch (e) {
    alert(s.deleteFailed);
  }
});

[nameInput, phoneInput, dateInput, productInput, amountInput].forEach(el => {
  el.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); saveCustomer(); } });
});

/* ---------- emoji picker ---------- */
const emojiBtn = document.getElementById("emojiBtn");
const emojiPanel = document.getElementById("emojiPanel");
const customEmojiInput = document.getElementById("customEmojiInput");

emojiBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  emojiPanel.classList.toggle("open");
});

document.querySelectorAll(".emoji-option").forEach(btn => {
  btn.addEventListener("click", () => {
    selectedEmoji = btn.dataset.emoji;
    emojiBtn.textContent = selectedEmoji;
    customEmojiInput.value = "";
    document.querySelectorAll(".emoji-option").forEach(b => b.classList.toggle("active", b === btn));
    emojiPanel.classList.remove("open");
  });
});

customEmojiInput.addEventListener("input", (e) => {
  const val = e.target.value.trim();
  if (val) {
    selectedEmoji = val;
    emojiBtn.textContent = val;
    document.querySelectorAll(".emoji-option").forEach(b => b.classList.remove("active"));
  }
});

document.addEventListener("click", (e) => {
  if (!emojiPanel.contains(e.target) && e.target !== emojiBtn) {
    emojiPanel.classList.remove("open");
  }
});

});
document.addEventListener("click", (e) => {
  if (!settingsPanel.contains(e.target) && e.target !== settingsBtn) {
    settingsPanel.classList.remove("open");
  }
});

document.querySelectorAll(".swatch").forEach(sw => {
  sw.addEventListener("click", () => {
    prefs.color = sw.dataset.color;
    savePrefs();
    applyPrefs();
  });
});

document.getElementById("customColor").addEventListener("input", (e) => {
  prefs.color = e.target.value;
  savePrefs();
  applyPrefs();
});

document.getElementById("darkToggle").addEventListener("click", () => {
  prefs.dark = !prefs.dark;
  savePrefs();
  applyPrefs();
});

document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    prefs.lang = btn.dataset.lang;
    savePrefs();
    applyPrefs();
  });
});

/* ---------- wish modal ---------- */
const wishOverlay = document.getElementById("wishOverlay");
const wishSubtitleEl = document.getElementById("wishSubtitle");
const wishTextarea = document.getElementById("wishTextarea");
const copyBtn = document.getElementById("copyBtn");
const copyLabelEl = document.getElementById("copyLabel");
const whatsappBtn = document.getElementById("whatsappBtn");
const noPhoneHint = document.getElementById("noPhoneHint");
let wishCustomerName = "";
let wishCustomerPhone = "";

function pickWish() {
  const s = t();
  const templates = s.wishes;
  const msg = templates[Math.floor(Math.random() * templates.length)](wishCustomerName);
  wishTextarea.value = msg;
}

function openWishModal(id) {
  const c = customers.find(x => x.id === id);
  if (!c) return;
  const s = t();
  wishCustomerName = c.name;
  wishCustomerPhone = c.phone || "";
  wishSubtitleEl.textContent = s.wishSubtitle(c.name);
  copyLabelEl.textContent = s.copy;
  pickWish();
  if (wishCustomerPhone) {
    whatsappBtn.style.display = "flex";
    noPhoneHint.style.display = "none";
  } else {
    whatsappBtn.style.display = "none";
    noPhoneHint.style.display = "block";
    noPhoneHint.textContent = s.noPhoneHint;
  }
  wishOverlay.classList.add("open");
}

function closeWishModal() {
  wishOverlay.classList.remove("open");
}

document.getElementById("shuffleBtn").addEventListener("click", pickWish);
document.getElementById("wishCloseBtn").addEventListener("click", closeWishModal);
wishOverlay.addEventListener("click", (e) => {
  if (e.target === wishOverlay) closeWishModal();
});

copyBtn.addEventListener("click", async () => {
  const s = t();
  try {
    await navigator.clipboard.writeText(wishTextarea.value);
  } catch (e) {
    wishTextarea.select();
    document.execCommand("copy");
  }
  copyLabelEl.textContent = s.copied;
  setTimeout(() => { copyLabelEl.textContent = s.copy; }, 1500);
});

whatsappBtn.addEventListener("click", () => {
  if (!wishCustomerPhone) return;
  const digits = wishCustomerPhone.replace(/[^\d+]/g, "").replace(/^\+/, "");
  const url = `https://wa.me/${digits}?text=${encodeURIComponent(wishTextarea.value)}`;
  window.open(url, "_blank");
});

applyPrefs();
loadCustomers();
</script>
</body>
</html>
