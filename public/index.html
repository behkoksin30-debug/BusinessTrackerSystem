<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>顾客记录</title>

<!-- PWA: 让网页可以像 App 一样添加到手机主屏幕 -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#C4635A" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="顾客记录" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF7F0;
    --text: #3A2E2A;
    --muted: #8A7A72;
    --muted-light: #B3A69B;
    --card: #FFFFFF;
    --card-border: #EDE4D8;
    --input-bg: #FDFBF7;
    --input-border: #E5DACB;
    --accent: #C4635A;
    --accent-text: #FBF7F0;
    --warn: #C97A2B;
  }
  html[data-theme="dark"] {
    --bg: #211D1A;
    --text: #F1EAE3;
    --muted: #B3A69B;
    --muted-light: #8A7A72;
    --card: #2B2622;
    --card-border: #3D362F;
    --input-bg: #26221E;
    --input-border: #3D362F;
    --accent-text: #211D1A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    transition: background 0.2s, color 0.2s;
  }
  .font-display { font-family: 'Fraunces', serif; }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: calc(48px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .icon-badge {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  h1 {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .subtitle {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 28px 52px;
  }

  /* settings */
  .settings-wrap { position: relative; }
  .settings-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .settings-btn:hover { color: var(--text); border-color: var(--accent); }
  .settings-panel {
    position: absolute;
    right: 0;
    top: 46px;
    width: 240px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    z-index: 20;
    display: none;
  }
  .settings-panel.open { display: block; }
  .settings-section { margin-bottom: 16px; }
  .settings-section:last-child { margin-bottom: 0; }
  .settings-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted-light);
    margin: 0 0 8px;
  }
  .swatches { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    padding: 0;
    flex-shrink: 0;
  }
  .swatch.active { border-color: var(--text); }
  .color-input-wrap {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    border: 1px dashed var(--muted-light);
    flex-shrink: 0;
  }
  .color-input-wrap input[type="color"] {
    position: absolute;
    top: -4px; left: -4px;
    width: 32px; height: 32px;
    border: none;
    cursor: pointer;
    background: none;
    padding: 0;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .toggle-row span { font-size: 13px; }
  .switch {
    width: 36px;
    height: 20px;
    border-radius: 999px;
    background: var(--input-border);
    position: relative;
    cursor: pointer;
    border: none;
    padding: 0;
    flex-shrink: 0;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: white;
    transition: left 0.15s;
  }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 18px; }
  .lang-toggle { display: flex; gap: 6px; }
  .lang-btn {
    flex: 1;
    padding: 6px 0;
    border-radius: 8px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--muted);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .lang-btn.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  .add-btn {
    width: 100%;
    padding: 13px 0;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
    transition: filter 0.15s;
  }
  .add-btn:hover { filter: brightness(0.94); }

  .empty-state, .loading-state {
    text-align: center;
    padding: 60px 0;
    color: var(--muted-light);
    font-size: 14px;
  }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 16px 18px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: var(--card);
    transition: border-color 0.15s;
    cursor: pointer;
  }
  .row:hover { border-color: color-mix(in srgb, var(--accent) 30%, var(--card-border)); }
  .row.today {
    background: color-mix(in srgb, var(--accent) 12%, var(--bg));
    border-color: color-mix(in srgb, var(--accent) 40%, var(--card-border));
  }
  .row.inactive {
    background: color-mix(in srgb, var(--warn) 8%, var(--bg));
    border-color: color-mix(in srgb, var(--warn) 30%, var(--card-border));
  }
  .row-left {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    min-width: 0;
    flex: 1 1 220px;
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--accent) 14%, var(--card));
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .row.today .avatar {
    background: var(--accent);
    color: var(--accent-text);
  }
  .info { min-width: 0; flex: 1; }
  .cust-name-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .cust-name {
    font-weight: 600;
    font-size: 14px;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .notes-dot {
    color: var(--muted-light);
    font-size: 12px;
    flex-shrink: 0;
  }
  .category-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }
  .category-badge.new { background: color-mix(in srgb, #5B5FC7 18%, var(--card)); color: #5B5FC7; }
  .category-badge.regular { background: color-mix(in srgb, var(--muted) 16%, var(--card)); color: var(--muted); }
  .category-badge.vip { background: color-mix(in srgb, #C08A2E 22%, var(--card)); color: #C08A2E; }
  .cust-meta {
    font-size: 12px;
    color: var(--muted);
    margin: 3px 0 0;
    line-height: 1.5;
  }
  .cust-meta.product-line {
    color: var(--text);
    opacity: 0.75;
  }
  .cust-meta.warn-line {
    color: var(--warn);
    font-weight: 600;
    opacity: 1;
  }
  .row-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .days-left {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted-light);
    margin-right: 4px;
    white-space: nowrap;
  }
  .row.today .days-left { color: var(--accent); }
  .icon-btn {
    background: none;
    border: none;
    color: var(--muted-light);
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    transition: color 0.15s, background 0.15s;
  }
  .icon-btn:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .icon-btn.whatsapp-icon:hover { color: #25D366; }

  .footer-count {
    text-align: center;
    font-size: 12px;
    color: var(--muted-light);
    margin-top: 32px;
  }

  /* modal shared */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
    overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--card);
    border-radius: 18px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 16px 48px rgba(0,0,0,0.2);
    margin: auto;
  }
  .modal-title {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
    font-family: 'Fraunces', serif;
  }
  .modal-subtitle {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .field-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted-light);
    margin: 14px 0 6px;
    display: block;
  }
  .field-label:first-of-type { margin-top: 4px; }
  input[type="text"], input[type="date"], input[type="tel"], textarea {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    outline: none;
  }
  textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
  input:focus, textarea:focus {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  input::placeholder, textarea::placeholder { color: var(--muted-light); }

  .emoji-row { display: flex; align-items: center; gap: 10px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .category-toggle {
    display: flex;
    gap: 6px;
  }
  .category-btn {
    flex: 1;
    padding: 8px 0;
    border-radius: 10px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .category-btn.active.new { background: color-mix(in srgb, #5B5FC7 18%, var(--input-bg)); color: #5B5FC7; border-color: #5B5FC7; }
  .category-btn.active.regular { background: color-mix(in srgb, var(--muted) 20%, var(--input-bg)); color: var(--text); border-color: var(--muted); }
  .category-btn.active.vip { background: color-mix(in srgb, #C08A2E 20%, var(--input-bg)); color: #C08A2E; border-color: #C08A2E; }

  .avatar-preview {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
  }
  .gender-toggle {
    display: flex;
    gap: 6px;
  }
  .gender-btn {
    flex: 1;
    padding: 8px 0;
    border-radius: 10px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .gender-btn.active { background: color-mix(in srgb, var(--accent) 18%, var(--input-bg)); color: var(--accent); border-color: var(--accent); }

  .demo-btn {
    flex: 1;
    padding: 8px 0;
    border-radius: 10px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .demo-btn.active { background: color-mix(in srgb, var(--accent) 18%, var(--input-bg)); color: var(--accent); border-color: var(--accent); }

  .tab-switcher {
    display: flex;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 0;
    border-radius: 10px;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .tab-btn.active { background: var(--accent); color: var(--accent-text); }
  .tab-count {
    font-size: 11px;
    font-weight: 700;
    margin-left: 4px;
    opacity: 0.75;
  }

  .opp-stats-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .opp-stat-chip {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .opp-stat-number {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    color: var(--accent);
    line-height: 1.1;
  }
  .opp-stat-label {
    font-size: 11px;
    color: var(--muted);
  }

  .demo-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: color-mix(in srgb, #2F8F84 15%, transparent);
    color: #2F8F84;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .background-line {
    font-size: 12px;
    color: var(--muted);
    margin: 3px 0 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .status-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }
  .status-badge.pending { background: rgba(138,122,114,0.15); color: var(--muted); }
  .status-badge.considering { background: rgba(192,138,46,0.18); color: #C08A2E; }
  .status-badge.not_interested { background: rgba(196,99,90,0.15); color: #C4635A; }
  .status-badge.joined { background: rgba(47,143,132,0.18); color: #2F8F84; }
  .status-badge.customer { background: rgba(91,95,199,0.15); color: #5B5FC7; }
  .status-badge.unreachable { background: rgba(138,122,114,0.2); color: var(--muted); }

  .opp-date-badge {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted-light);
    white-space: nowrap;
    flex-shrink: 0;
  }

  select {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    outline: none;
  }
  select:focus {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }

  .app-title-input {
    width: 100%;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    outline: none;
  }
  .app-title-input:focus {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }

  .icon-upload-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .icon-upload-preview {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: var(--accent);
    color: var(--accent-text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .icon-upload-preview img { width: 100%; height: 100%; object-fit: cover; }
  .icon-upload-btn {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
  }
  .icon-upload-btn:hover { border-color: var(--accent); }
  .icon-upload-reset {
    padding: 6px 12px;
    border-radius: 8px;
    border: none;
    background: none;
    color: var(--muted-light);
    font-size: 12px;
    cursor: pointer;
  }
  .icon-upload-reset:hover { color: var(--accent); }

  .error-msg {
    font-size: 12px;
    color: var(--accent);
    margin: 10px 0 0;
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
  }
  .modal-actions button {
    flex: 1;
    padding: 10px 0;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .modal-actions button.primary-btn {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  .modal-actions button:hover { filter: brightness(0.96); }
  .delete-row-btn {
    width: 100%;
    margin-top: 10px;
    padding: 9px 0;
    border-radius: 12px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--muted-light);
    text-align: center;
  }
  .delete-row-btn:hover { color: var(--accent); }

  .modal-textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
    outline: none;
  }
  .whatsapp-btn {
    width: 100%;
    margin-top: 12px;
    padding: 10px 0;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: #25D366;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .whatsapp-btn:hover { filter: brightness(0.95); }
  .no-phone-hint {
    font-size: 12px;
    color: var(--muted-light);
    text-align: center;
    margin: 10px 0 0;
  }
  .modal-close {
    display: block;
    margin: 12px auto 0;
    background: none;
    border: none;
    color: var(--muted-light);
    font-size: 12px;
    cursor: pointer;
    padding: 4px;
  }
  .modal-back-btn {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: var(--input-bg);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .modal-back-btn:hover { color: var(--accent); border-color: var(--accent); }
  .modal-close:hover { color: var(--muted); }

  /* purchases section (edit modal) */
  .purchases-section {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--card-border);
  }
  .purchase-row {
    position: relative;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .purchase-remove {
    position: absolute;
    top: 8px;
    right: 8px;
    background: none;
    border: none;
    color: var(--muted-light);
    cursor: pointer;
    padding: 4px;
    display: flex;
    border-radius: 6px;
  }
  .purchase-remove:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .purchase-row textarea.product-textarea {
    min-height: 70px;
  }
  .purchase-row textarea.purchase-note-textarea {
    min-height: 50px;
  }
  .amount-wrap {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--input-border);
    border-radius: 12px;
    background: var(--input-bg);
    overflow: hidden;
  }
  .amount-wrap .rm-prefix {
    display: flex;
    align-items: center;
    padding: 0 4px 0 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
    background: color-mix(in srgb, var(--accent) 8%, var(--input-bg));
  }
  .amount-wrap input {
    border: none !important;
    background: transparent !important;
    box-shadow: none !important;
    padding-left: 6px;
  }
  .add-purchase-btn {
    width: 100%;
    padding: 10px 0;
    border-radius: 12px;
    border: 1px dashed var(--input-border);
    background: none;
    color: var(--muted);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 4px;
  }
  .add-purchase-btn:hover { color: var(--accent); border-color: var(--accent); }
  .no-purchases-hint {
    font-size: 12px;
    color: var(--muted-light);
    text-align: center;
    padding: 10px 0;
  }

  /* customer detail (view) modal */
  .detail-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .detail-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--accent) 14%, var(--card));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .detail-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .detail-name { font-size: 17px; font-weight: 600; margin: 0; font-family: 'Fraunces', serif; }
  .detail-info-line {
    font-size: 13px;
    color: var(--muted);
    margin: 2px 0 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .detail-warn-banner {
    font-size: 12px;
    font-weight: 600;
    color: var(--warn);
    background: color-mix(in srgb, var(--warn) 12%, var(--card));
    border-radius: 10px;
    padding: 8px 12px;
    margin: 12px 0;
  }
  .detail-notes-box {
    font-size: 13px;
    color: var(--text);
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 12px;
    padding: 10px 12px;
    margin: 6px 0 0;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .detail-section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 18px 0 8px;
  }
  .history-item {
    border-left: 2px solid var(--card-border);
    padding: 2px 0 14px 14px;
    margin-left: 4px;
    position: relative;
  }
  .history-item::before {
    content: "";
    position: absolute;
    left: -5px;
    top: 4px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }
  .history-item:last-child { padding-bottom: 0; }
  .history-date {
    font-size: 11px;
    color: var(--muted-light);
    font-weight: 600;
  }
  .history-product {
    font-size: 14px;
    color: var(--text);
    margin: 2px 0 0;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .history-amount {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    margin-top: 2px;
  }
  .history-note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    background: var(--input-bg);
    border-radius: 8px;
    padding: 6px 10px;
    white-space: pre-wrap;
  }

  @media (max-width: 480px) {
    .two-col { grid-template-columns: 1fr; }
  }
</style>

function daysUntilNextBirthday(dateStr) {
  if (!dateStr) return Infinity;
  const today = new Date();
  today.setHours(0,0,0,0);
  const [m, d] = dateStr.split("-").map(Number);
  let next = new Date(today.getFullYear(), m - 1, d);
  if (next < today) next = new Date(today.getFullYear() + 1, m - 1, d);
  return Math.round((next - today) / 86400000);
}

function parseMonthDay(dateStr) {
  const [m, d] = dateStr.split("-").map(Number);
  return [m, d];
}

function populateMonthDaySelect(monthId, dayId, allowEmpty) {
  const monthSel = document.getElementById(monthId);
  const daySel = document.getElementById(dayId);
  if (!monthSel || !daySel) return;
  const s = t();
  const prevMonth = monthSel.value;
  const prevDay = daySel.value;
  monthSel.innerHTML = "";
  daySel.innerHTML = "";
  if (allowEmpty) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = s.monthPlaceholder;
    monthSel.appendChild(opt);
    const opt2 = document.createElement("option");
    opt2.value = "";
    opt2.textContent = s.dayPlaceholder;
    daySel.appendChild(opt2);
  }
  for (let m = 1; m <= 12; m++) {
    const opt = document.createElement("option");
    opt.value = String(m).padStart(2, "0");
    opt.textContent = s.monthOptionLabel(m);
    monthSel.appendChild(opt);
  }
  for (let d = 1; d <= 31; d++) {
    const opt = document.createElement("option");
    opt.value = String(d).padStart(2, "0");
    opt.textContent = s.dayOptionLabel(d);
    daySel.appendChild(opt);
  }
  monthSel.value = prevMonth;
  daySel.value = prevDay;
}

function getMonthDayValue(monthId, dayId) {
  const monthSel = document.getElementById(monthId);
  const daySel = document.getElementById(dayId);
  if (!monthSel || !daySel) return "";
  const m = monthSel.value;
  const d = daySel.value;
  if (!m || !d) return "";
  return `${m}-${d}`;
}

function setMonthDayValue(monthId, dayId, mmdd) {
  const monthSel = document.getElementById(monthId);
  const daySel = document.getElementById(dayId);
  if (!monthSel || !daySel) return;
  if (!mmdd) {
    monthSel.value = "";
    daySel.value = "";
    return;
  }
  let md = mmdd;
  if (/^\d{4}-\d{2}-\d{2}$/.test(mmdd)) md = mmdd.slice(5);
  const [m, d] = md.split("-");
  monthSel.value = m;
  daySel.value = d;
}

function lastPurchaseDate(purchases) {
  const dates = (purchases || [])
    .map(p => p.date)
    .filter(d => d && /^\d{4}-\d{2}-\d{2}$/.test(d))
    .map(d => new Date(d));
  if (dates.length === 0) return null;
  return new Date(Math.max(...dates.map(d => d.getTime())));
}

function daysSince(date) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const d = new Date(date);
  d.setHours(0,0,0,0);
  return Math.round((today - d) / 86400000);
}

const contentEl = document.getElementById("content");
const footerEl = document.getElementById("footerCount");

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function escapeAttr(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function render() {
  const s = t();
  document.getElementById("tabCustomersCount").textContent = customers.length > 0 ? `(${customers.length})` : "";
  if (customers.length === 0) {
    contentEl.innerHTML = `<div class="empty-state">${s.empty}</div>`;
    footerEl.style.display = "none";
    return;
  }

  const sorted = [...customers]
    .map(c => ({ ...c, days: daysUntilNextBirthday(c.date) }))
    .sort((a, b) => a.days - b.days);

  const rows = sorted.map(c => {
    const hasBirthday = !!c.date;
    const isToday = hasBirthday && c.days === 0;
    const [mm, dd] = hasBirthday ? parseMonthDay(c.date) : [0, 0];
    const purchases = Array.isArray(c.purchases) ? c.purchases : [];
    const category = c.category || "new";

    let purchaseLine = "";
    if (purchases.length > 0) {
      const total = purchases.reduce((sum, p) => {
        const n = parseFloat(String(p.amount).replace(/[^\d.]/g, ""));
        return sum + (isNaN(n) ? 0 : n);
      }, 0);
      const totalStr = Number.isInteger(total) ? String(total) : total.toFixed(2);
      purchaseLine = `<p class="cust-meta product-line">${s.purchasesSummary(purchases.length, totalStr)}</p>`;
    }

    let isInactive = false;
    const lastDate = lastPurchaseDate(purchases);
    if (lastDate && daysSince(lastDate) >= INACTIVE_DAYS_THRESHOLD) {
      isInactive = true;
    }
    const warnLine = isInactive ? `<p class="cust-meta warn-line">${s.inactiveWarning}</p>` : "";

    const extraBits = [];
    if (c.lastMeeting) extraBits.push(escapeHtml(s.lastMeetingRowLabel(c.lastMeeting)));
    if (c.sawDemo === "yes") extraBits.push(`<span class="demo-badge">${s.sawDemoBadge}</span>`);
    const extraLine = extraBits.length > 0 ? `<p class="cust-meta">${extraBits.join(" · ")}</p>` : "";

    const whatsappIcon = c.phone
      ? `<button class="icon-btn whatsapp-icon" onclick="event.stopPropagation(); openWhatsAppChat('${c.id}')" aria-label="${s.whatsappChatLabel}">

        </button>`
      : "";

    return `
      <div class="row ${isToday ? "today" : ""} ${isInactive ? "inactive" : ""}" onclick="openDetailModal('${c.id}')">
        <div class="row-left">
          <div class="avatar">${genderAvatar(c)}</div>
          <div class="info">
            <div class="cust-name-row">
              <p class="cust-name">${escapeHtml(c.name)}</p>
              <span class="category-badge ${category}">${categoryLabel(category)}</span>
              ${c.notes ? `<span class="notes-dot" title="${escapeAttr(c.notes)}">📝</span>` : ""}
            </div>
            <p class="cust-meta">${hasBirthday ? s.monthDay(mm, dd) + (c.phone ? " · " + escapeHtml(c.phone) : "") : (c.phone ? escapeHtml(c.phone) : s.noBirthdayHint)}</p>
            ${purchaseLine}
            ${extraLine}
            ${warnLine}
          </div>
        </div>
        <div class="row-right">
          ${hasBirthday ? `<span class="days-left">${isToday ? s.todayBirthday : s.daysAfter(c.days)}</span>` : ""}
          ${whatsappIcon}
          <button class="icon-btn" onclick="event.stopPropagation(); openWishModal('${c.id}')" aria-label="${s.sendWishLabel}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          </button>
          <button class="icon-btn" onclick="event.stopPropagation(); openEditModal('${c.id}')" aria-label="${s.editLabel}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
          </button>

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>

}

let historyPushed = false;

  if (!historyPushed) {
    history.pushState({ appModal: true }, "");
    historyPushed = true;
  }
}

function releaseHistoryIfAllClosed() {
  const anyOpen = document.querySelector(".modal-overlay.open");
  if (!anyOpen && historyPushed) {
    historyPushed = false;
    history.back();
  }
}

window.addEventListener("popstate", () => {
  document.querySelectorAll(".modal-overlay.open").forEach(el => el.classList.remove("open"));

});

function renderProspects() {
  if (!prospectsContentEl) return;
  const s = t();
  document.getElementById("tabProspectsCount").textContent = prospects.length > 0 ? `(${prospects.length})` : "";

  const oppStatsBar = document.getElementById("oppStatsBar");
  const withOppDate = prospects.filter(p => p.oppDate);
  if (withOppDate.length > 0) {
    const now = new Date();
    const thisMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
    const thisMonthCount = withOppDate.filter(p => p.oppDate.startsWith(thisMonthKey)).length;
    oppStatsBar.style.display = "flex";
    document.getElementById("oppStatsThisMonthNum").textContent = thisMonthCount;
    document.getElementById("oppStatsThisMonthLabel").textContent = s.oppStatsThisMonthLabel;
    document.getElementById("oppStatsTotalNum").textContent = withOppDate.length;
    document.getElementById("oppStatsTotalLabel").textContent = s.oppStatsTotalLabel;
  } else {
    oppStatsBar.style.display = "none";
  }

  if (prospects.length === 0) {
    prospectsContentEl.innerHTML = `<div class="empty-state">${s.prospectEmpty}</div>`;
    prospectsFooterEl.style.display = "none";
    return;
  }

  const sorted = [...prospects].sort((a, b) => {
    if (a.oppDate && b.oppDate) return b.oppDate.localeCompare(a.oppDate);
    if (a.oppDate) return -1;
    if (b.oppDate) return 1;
    return 0;
  });

  const rows = sorted.map(p => {

async function saveProspect() {
  const s = t();
  const name = prospectNameInput.value.trim();
  const phone = prospectPhoneInput.value.trim();
  const dateMonth = document.getElementById("prospectDateMonthSelect").value;
  const dateDay = document.getElementById("prospectDateDaySelect").value;
  const oppDate = oppDateInput.value;
  const background = backgroundInput.value.trim();
  const notes = prospectNotesInput.value.trim();
  const status = document.getElementById("statusSelect").value;
  prospectErrorMsg.style.display = "none";

  if (!name) { showProspectError(s.errorName); return; }
  if ((dateMonth && !dateDay) || (!dateMonth && dateDay)) { showProspectError(s.errorIncompleteDate); return; }
  if (phone && !/^[+\d][\d\s\-()]{4,}$/.test(phone)) { showProspectError(s.errorPhone); return; }
  const date = dateMonth && dateDay ? `${dateMonth}-${dateDay}` : "";

  syncFollowUpRowsFromDOM();
  const followUps = followUpRows
    .map(r => ({ date: r.date.trim(), note: r.note.trim() }))
    .filter(f => f.date || f.note);

  const payload = { name, gender: pSelectedGender, background, date, phone, oppDate, notes, status, followUps };

  try {
    let res, saved;
    if (editingProspectId) {
      res = await fetch(`${PROSPECTS_API}/${editingProspectId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
    } else {
      res = await fetch(PROSPECTS_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
    }
    if (!res.ok) {
      const data = await res.json();
      showProspectError(data.error || s.errorAdd);
      return;
    }
    saved = await res.json();
    if (editingProspectId) {
      prospects = prospects.map(p => p.id === editingProspectId ? saved : p);
    } else {
      prospects.push(saved);
    }
    closeProspectModal();
    renderProspects();
  } catch (e) {
    showProspectError(s.errorNetwork);
  }
}

document.getElementById("saveProspectBtn").addEventListener("click", saveProspect);

async function deleteProspectById(id) {
  const s = t();
  try {
    await fetch(`${PROSPECTS_API}/${id}`, { method: "DELETE" });
    prospects = prospects.filter(p => p.id !== id);
    renderProspects();
    return true;
  } catch (e) {
    alert(s.deleteFailed);
    return false;
  }
}

async function saveBirthday() {
  const s = t();
  const name = birthdayNameInput.value.trim();
  const phone = birthdayPhoneInput.value.trim();
  const date = getMonthDayValue("birthdayDateMonthSelect", "birthdayDateDaySelect");
  const notes = birthdayNotesInput.value.trim();
  birthdayErrorMsg.style.display = "none";

  if (!date) { showBirthdayError(s.errorDate); return; }
  if (phone && !/^[+\d][\d\s\-()]{4,}$/.test(phone)) { showBirthdayError(s.errorPhone); return; }

  const payload = { name, gender: bSelectedGender, date, phone, notes };

  try {
    let res, saved;
    if (editingBirthdayId) {
      res = await fetch(`${BIRTHDAYS_API}/${editingBirthdayId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
    } else {
      res = await fetch(BIRTHDAYS_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
    }
    if (!res.ok) {
      const data = await res.json();
      showBirthdayError(data.error || s.errorAdd);
      return;
    }
    saved = await res.json();
    if (editingBirthdayId) {

async function saveCustomer() {
  const s = t();
  const name = nameInput.value.trim();
  const phone = phoneInput.value.trim();
  const dateMonth = document.getElementById("dateMonthSelect").value;
  const dateDay = document.getElementById("dateDaySelect").value;
  const notes = notesInput.value.trim();
  const lastMeeting = document.getElementById("lastMeetingInput").value;
  errorMsg.style.display = "none";

  if (!name) { showError(s.errorName); return; }
  if ((dateMonth && !dateDay) || (!dateMonth && dateDay)) { showError(s.errorIncompleteDate); return; }
  if (phone && !/^[+\d][\d\s\-()]{4,}$/.test(phone)) { showError(s.errorPhone); return; }
  const date = dateMonth && dateDay ? `${dateMonth}-${dateDay}` : "";

  syncPurchaseRowsFromDOM();
  const purchases = purchaseRows
    .map(r => ({ date: r.date.trim(), product: r.product.trim(), amount: r.amount.trim(), note: r.note.trim() }))
    .filter(p => p.date || p.product || p.amount || p.note);

  const payload = { name, date, phone, gender: selectedGender, purchases, notes, category: selectedCategory, lastMeeting, sawDemo: selectedSawDemo };

  try {
    let res, saved;
    if (editingId) {
      res = await fetch(`${API}/${editingId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
    } else {
      res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
    }
    if (!res.ok) {
      const data = await res.json();
      showError(data.error || s.errorAdd);
      return;
    }
    saved = await res.json();
    if (editingId) {
      customers = customers.map(c => c.id === editingId ? saved : c);
    } else {
      customers.push(saved);
    }
    closeCustomerModal();
    render();
  } catch (e) {
    showError(s.errorNetwork);
  }
}

function updateIconBadge() {
  const badge = document.getElementById("iconBadge");
  const preview = document.getElementById("iconUploadPreview");
  if (prefs.customIcon) {
    badge.innerHTML = `<img src="${prefs.customIcon}" alt="" />`;
    preview.innerHTML = `<img src="${prefs.customIcon}" alt="" />`;

document.getElementById("iconUploadInput").addEventListener("change", (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const s = t();
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const size = 128;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale;
      const h = img.height * scale;
      ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      const dataUrl = canvas.toDataURL("image/png", 0.9);
      if (dataUrl.length > 900000) {
        alert(s.iconTooLargeError);
        return;
      }
      prefs.customIcon = dataUrl;
      savePrefs();
      updateIconBadge();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});
